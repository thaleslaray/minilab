<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACADEMIA ESPACIAL SYNTH — MiniLab 3</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;overflow:hidden;font-family:'Courier New',monospace;color:#00ffcc;user-select:none}
canvas{display:block;position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:0}

/* Game Overlay */
#game-overlay{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:20;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center}
.phase-title{font-size:24px;letter-spacing:8px;text-transform:uppercase;text-shadow:0 0 30px #00ffcc,0 0 60px rgba(0,255,204,0.3);opacity:0;transition:opacity 0.8s;position:absolute;top:15%}
.phase-title.visible{opacity:1}
.phase-subtitle{font-size:13px;letter-spacing:4px;color:rgba(0,255,204,0.5);position:absolute;top:22%;opacity:0;transition:opacity 0.6s}
.phase-subtitle.visible{opacity:1}

.narrative-box{position:absolute;bottom:25%;left:50%;transform:translateX(-50%);width:600px;max-width:90vw;text-align:center}
.narrative-text{font-size:14px;letter-spacing:2px;color:#88ccbb;line-height:1.8;min-height:60px;text-shadow:0 0 8px rgba(0,255,204,0.3)}
.narrative-cursor{display:inline-block;width:8px;height:16px;background:#00ffcc;animation:blink 0.8s step-end infinite;vertical-align:middle;margin-left:2px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

.reveal-text{font-size:13px;letter-spacing:2px;color:#ffcc44;line-height:1.8;text-shadow:0 0 12px rgba(255,204,68,0.4);opacity:0;transition:opacity 0.8s}
.reveal-text.visible{opacity:1}
.reveal-line{width:0;height:1px;background:linear-gradient(90deg,transparent,#ffcc44,transparent);margin:12px auto;transition:width 0.6s}
.reveal-line.visible{width:300px}

.objective-hud{position:fixed;top:50px;right:24px;font-size:11px;letter-spacing:2px;color:rgba(0,255,204,0.6);text-align:right;z-index:21;pointer-events:none}
.proximity-label{position:fixed;top:50%;left:50%;transform:translate(-50%,-80px);font-size:18px;letter-spacing:6px;text-shadow:0 0 20px currentColor;opacity:0;transition:opacity 0.15s,color 0.15s;z-index:21;pointer-events:none}
.proximity-label.visible{opacity:1}

/* Connection status */
.hud-status{position:fixed;top:20px;left:24px;font-size:12px;letter-spacing:2px;text-transform:uppercase;display:flex;align-items:center;gap:8px;z-index:25;pointer-events:none}
.hud-dot{width:8px;height:8px;border-radius:50%;background:#ff3333;animation:pulse 1.5s ease-in-out infinite}
.hud-dot.online{background:#00ff88;box-shadow:0 0 8px #00ff88}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}

/* Start screen */
#start-screen{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:100;background:#0a0a1a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;cursor:pointer}
#start-screen h1{font-size:26px;letter-spacing:10px;text-transform:uppercase;text-shadow:0 0 30px #00ffcc,0 0 60px rgba(0,255,204,0.3);color:#00ffcc}
#start-screen p{font-size:13px;letter-spacing:3px;color:rgba(0,255,204,0.5);animation:pulse 2s ease-in-out infinite}
#start-screen .subtitle{font-size:11px;color:rgba(255,102,0,0.4);letter-spacing:2px}

/* Mission complete */
#mission-complete{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:30;background:rgba(10,10,26,0.95);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;pointer-events:auto}
#mission-complete.active{display:flex}
#mission-complete h1{font-size:28px;letter-spacing:10px;color:#00ffcc;text-shadow:0 0 30px #00ffcc}
.score-row{font-size:13px;letter-spacing:3px;color:#88ccbb;display:flex;gap:16px;align-items:center}
.score-stars{color:#ffcc44;letter-spacing:1px}
.score-total{font-size:16px;letter-spacing:4px;color:#ffcc44;margin-top:12px;text-shadow:0 0 12px rgba(255,204,68,0.4)}
.concepts-unlocked{font-size:11px;letter-spacing:3px;color:rgba(0,255,204,0.5);margin-top:16px}
.restart-prompt{font-size:12px;letter-spacing:3px;color:rgba(0,255,204,0.3);animation:pulse 2s ease-in-out infinite;margin-top:24px}

/* Control hint diagram */
.control-hint{position:fixed;bottom:2%;left:50%;transform:translateX(-50%) scale(0.75);z-index:22;pointer-events:none;opacity:0;transition:opacity 0.5s}
.control-hint.visible{opacity:1}
.control-hint-diagram{background:rgba(10,10,26,0.7);border:1px solid rgba(0,255,204,0.15);border-radius:8px;padding:8px 12px}
.hint-group{transition:opacity 0.3s}
@keyframes hint-blink{0%,100%{opacity:1}50%{opacity:0.3}}
.hint-active{animation:hint-blink 1s ease-in-out infinite}
</style>

<script>
// ============================================================
// MIDI CONTROLLER (reused)
// ============================================================
class MIDIController {
  constructor() {
    this.input = null; this.listeners = {}; this.ccMap = {};
    this.slotLabels = [
      'TURN KNOB 1','TURN KNOB 2','TURN KNOB 3','TURN KNOB 4',
      'TURN KNOB 5','TURN KNOB 6','TURN KNOB 7','TURN KNOB 8',
      'MOVE FADER 1','MOVE FADER 2','MOVE FADER 3','MOVE FADER 4'
    ];
    this.learnIndex = 0; this.learnMode = false;
    this.learnedCCs = new Array(12).fill(null);
  }
  on(ev, fn) { if (!this.listeners[ev]) this.listeners[ev] = []; this.listeners[ev].push(fn); }
  emit(ev, data) { const fns = this.listeners[ev]; if (fns) for (let i = 0; i < fns.length; i++) fns[i](data); }
  async init() {
    try {
      const access = await navigator.requestMIDIAccess({ sysex: false });
      this.scanInputs(access);
      access.onstatechange = () => this.scanInputs(access);
    } catch (e) { this.emit('connectionChange', false); }
  }
  scanInputs(access) {
    let found = null;
    for (const input of access.inputs.values()) { if (input.name.toLowerCase().includes('minilab')) { found = input; break; } }
    if (!found) { for (const input of access.inputs.values()) { found = input; break; } }
    if (found && found !== this.input) {
      if (this.input) this.input.onmidimessage = null;
      this.input = found;
      this.input.onmidimessage = (e) => this.onMessage(e);
      this.emit('connectionChange', true);
    } else if (!found) { this.input = null; this.emit('connectionChange', false); }
  }
  onMessage(e) {
    const d = e.data; const type = d[0] & 0xF0; const ch = (d[0] & 0x0F) + 1;
    if (type === 0x90 && d[2] > 0) { this.emit('noteOn', { channel: ch, note: d[1], velocity: d[2] }); }
    else if (type === 0x80 || (type === 0x90 && d[2] === 0)) { this.emit('noteOff', { channel: ch, note: d[1] }); }
    else if (type === 0xB0) {
      this.emit('rawCC', { channel: ch, cc: d[1], value: d[2] });
      if (d[1] === 1) { this.emit('modWheel', { value: d[2] }); return; }
      this.emit('cc', { channel: ch, cc: d[1], value: d[2] });
    }
    else if (type === 0xE0) { this.emit('pitchBend', { value: ((d[2] << 7) | d[1]) / 16383 }); }
    else if (type === 0xA0) { this.emit('polyAftertouch', { channel: ch, note: d[1], pressure: d[2] }); }
  }
}

// ============================================================
// AUDIO ENGINE (extended)
// ============================================================
class AudioEngine {
  constructor() {
    this.ctx = null; this.masterGain = null; this.filter = null;
    this.reverbDry = null; this.reverbWet = null; this.convolver = null;
    this.voices = {}; this.voiceOrder = []; this.droneVoice = null;
  }
  init() {
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    this.masterGain = this.ctx.createGain();
    this.masterGain.gain.value = 0.7;
    this.masterGain.connect(this.ctx.destination);
    this.filter = this.ctx.createBiquadFilter();
    this.filter.type = 'lowpass'; this.filter.frequency.value = 4000; this.filter.Q.value = 3;
    this.reverbDry = this.ctx.createGain(); this.reverbDry.gain.value = 0.7;
    this.reverbWet = this.ctx.createGain(); this.reverbWet.gain.value = 0.3;
    this.convolver = this.ctx.createConvolver();
    const rate = this.ctx.sampleRate; const len = rate * 2.5;
    const irBuf = this.ctx.createBuffer(2, len, rate);
    for (let ch = 0; ch < 2; ch++) { const dd = irBuf.getChannelData(ch); for (let i = 0; i < len; i++) dd[i] = (Math.random()*2-1)*Math.pow(1-i/len,3); }
    this.convolver.buffer = irBuf;
    this.filter.connect(this.reverbDry); this.filter.connect(this.convolver);
    this.reverbDry.connect(this.masterGain); this.convolver.connect(this.reverbWet);
    this.reverbWet.connect(this.masterGain);
  }
  noteToFreq(n) { return 440 * Math.pow(2, (n - 69) / 12); }
  noteOn(note, velocity) {
    if (!this.ctx) return;
    if (this.voiceOrder.length >= 8) this.killVoice(this.voiceOrder.shift());
    const freq = this.noteToFreq(note); const vol = (velocity/127)*0.3; const now = this.ctx.currentTime;
    const o1 = this.ctx.createOscillator(); const o2 = this.ctx.createOscillator();
    o1.type = 'sawtooth'; o2.type = 'square'; o1.frequency.value = freq; o2.frequency.value = freq*1.003;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0, now); g.gain.linearRampToValueAtTime(vol, now+0.01); g.gain.linearRampToValueAtTime(vol*0.7, now+0.12);
    o1.connect(g); o2.connect(g); g.connect(this.filter); o1.start(now); o2.start(now);
    this.voices[note] = { osc1:o1, osc2:o2, gain:g }; this.voiceOrder.push(note);
  }
  noteOff(note) {
    if (!this.ctx || !this.voices[note]) return;
    const v = this.voices[note]; const now = this.ctx.currentTime;
    v.gain.gain.cancelScheduledValues(now); v.gain.gain.setValueAtTime(v.gain.gain.value, now);
    v.gain.gain.linearRampToValueAtTime(0, now+0.3);
    const n = note; setTimeout(() => this.killVoice(n), 350);
  }
  killVoice(note) {
    const v = this.voices[note]; if (!v) return;
    try{v.osc1.stop()}catch(e){} try{v.osc2.stop()}catch(e){}
    try{v.osc1.disconnect()}catch(e){} try{v.osc2.disconnect()}catch(e){} try{v.gain.disconnect()}catch(e){}
    delete this.voices[note]; this.voiceOrder = this.voiceOrder.filter(n=>n!==note);
  }
  // Extended: play note with auto-off
  playNote(note, velocity, durationSec) {
    this.noteOn(note, velocity);
    setTimeout(() => this.noteOff(note), durationSec * 1000);
  }
  // Extended: play sequence
  playSequence(notes, velocity, gapMs, callback) {
    let i = 0;
    const next = () => {
      if (i >= notes.length) { if (callback) callback(); return; }
      this.playNote(notes[i], velocity, gapMs * 0.8 / 1000);
      i++;
      setTimeout(next, gapMs);
    };
    next();
  }
  // Extended: drone
  playDrone(note, velocity) {
    if (!this.ctx) return; this.stopDrone();
    const freq = this.noteToFreq(note); const vol = (velocity/127)*0.25; const now = this.ctx.currentTime;
    const o1 = this.ctx.createOscillator(); const o2 = this.ctx.createOscillator();
    o1.type = 'sawtooth'; o2.type = 'triangle'; o1.frequency.value = freq; o2.frequency.value = freq*0.998;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0, now); g.gain.linearRampToValueAtTime(vol, now+0.5);
    o1.connect(g); o2.connect(g); g.connect(this.filter); o1.start(now); o2.start(now);
    this.droneVoice = { osc1:o1, osc2:o2, gain:g };
  }
  stopDrone() {
    if (!this.droneVoice) return;
    const v = this.droneVoice; const now = this.ctx.currentTime;
    v.gain.gain.cancelScheduledValues(now); v.gain.gain.setValueAtTime(v.gain.gain.value, now);
    v.gain.gain.linearRampToValueAtTime(0, now+0.3);
    setTimeout(() => { try{v.osc1.stop()}catch(e){} try{v.osc2.stop()}catch(e){} }, 350);
    this.droneVoice = null;
  }
  setFilterDirect(norm) {
    if (!this.ctx) return;
    this.filter.frequency.setTargetAtTime(100 * Math.pow(80, norm), this.ctx.currentTime, 0.02);
  }
  playPadHit(velocity) {
    if (!this.ctx) return; const now = this.ctx.currentTime; const vol = (velocity/127)*0.35;
    const bufLen = this.ctx.sampleRate*0.12; const buf = this.ctx.createBuffer(1, bufLen, this.ctx.sampleRate);
    const data = buf.getChannelData(0); for (let i=0;i<bufLen;i++) data[i]=(Math.random()*2-1)*Math.pow(1-i/bufLen,3);
    const ns = this.ctx.createBufferSource(); ns.buffer = buf;
    const ng = this.ctx.createGain(); ng.gain.value = vol;
    ns.connect(ng); ng.connect(this.masterGain); ns.start(now);
  }
}

// ============================================================
// VISUAL ENGINE (extended for game)
// ============================================================
class VisualEngine {
  constructor(canvas) {
    this.canvas = canvas; this.ctx = canvas.getContext('2d');
    this.stars = []; this.particles = []; this.effects = [];
    this.w = 0; this.h = 0; this.cx = 0; this.cy = 0;
    this.shipX = 0; this.shipY = 0; this.shipVisible = false; this.shipScale = 1;
    this.bgAlpha = 0.18; this.bgColor = [10,10,26];
    this.resize(); window.addEventListener('resize', () => this.resize());
    this.initParticlePool();
  }
  resize() {
    const dpr = window.devicePixelRatio||1;
    this.w = window.innerWidth; this.h = window.innerHeight;
    this.canvas.width = this.w*dpr; this.canvas.height = this.h*dpr;
    this.ctx.setTransform(dpr,0,0,dpr,0,0);
    this.cx = this.w/2; this.cy = this.h/2;
    this.shipX = this.cx; this.shipY = this.cy;
  }
  setStarCount(n) {
    while (this.stars.length < n) this.stars.push({ x:Math.random()*this.w, y:Math.random()*this.h, z:Math.random()*3+0.5, brightness:Math.random()*0.8+0.2, phase:Math.random()*6.28, size:Math.random()*1.5+0.5 });
    while (this.stars.length > n) this.stars.pop();
  }
  initParticlePool() {
    this.particles = [];
    for (let i=0;i<500;i++) this.particles.push({alive:false,x:0,y:0,vx:0,vy:0,life:0,maxLife:1,size:2,hue:30});
  }
  emitParticle(x,y,vx,vy,life,size,hue) {
    for (let i=0;i<this.particles.length;i++) {
      const p = this.particles[i];
      if (!p.alive) { p.alive=true;p.x=x;p.y=y;p.vx=vx;p.vy=vy;p.life=life;p.maxLife=life;p.size=size;p.hue=hue; return; }
    }
  }
  emitBurst(x,y,count,speed,hue,life) {
    for (let i=0;i<count;i++) {
      const a = Math.random()*6.28; const s = speed*(0.5+Math.random());
      this.emitParticle(x,y,Math.cos(a)*s,Math.sin(a)*s,life||0.6+Math.random()*0.4,1+Math.random()*2,hue);
    }
  }
  updateParticles(dt) {
    const dt60 = dt*60;
    for (let i=0;i<this.particles.length;i++) {
      const p = this.particles[i]; if (!p.alive) continue;
      p.x+=p.vx*dt60; p.y+=p.vy*dt60; p.life-=dt; p.size*=0.997;
      if (p.life<=0) p.alive=false;
    }
  }
  renderBg(time) {
    const c = this.ctx; const bg = this.bgColor;
    c.fillStyle = 'rgba('+bg[0]+','+bg[1]+','+bg[2]+','+this.bgAlpha+')';
    c.fillRect(0,0,this.w,this.h);
  }
  renderStars(time) {
    const c = this.ctx;
    for (let i=0;i<this.stars.length;i++) {
      const s = this.stars[i];
      const tw = Math.sin(time*2+s.phase)*0.3+0.7;
      c.globalAlpha = s.brightness*tw;
      c.fillStyle = '#ddeeff';
      c.beginPath(); c.arc(s.x,s.y,s.size,0,6.28); c.fill();
    }
    c.globalAlpha = 1;
  }
  renderParticles(time, bloom) {
    const c = this.ctx;
    c.shadowBlur = bloom||0;
    for (let i=0;i<this.particles.length;i++) {
      const p = this.particles[i]; if (!p.alive) continue;
      const alpha = Math.max(0,p.life/p.maxLife);
      c.globalAlpha = alpha*0.8;
      c.shadowColor = 'hsl('+p.hue+',100%,60%)';
      c.fillStyle = 'hsl('+p.hue+',100%,'+(50+alpha*30)+'%)';
      c.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);
    }
    c.globalAlpha=1; c.shadowBlur=0;
  }
  renderShip(time) {
    if (!this.shipVisible) return;
    const c = this.ctx; const bob = Math.sin(time*1.5)*3;
    c.save(); c.translate(this.shipX, this.shipY+bob); c.scale(this.shipScale,this.shipScale);
    c.shadowBlur=12; c.shadowColor='#00ffcc';
    c.strokeStyle='hsl(180,80%,70%)'; c.lineWidth=2;
    c.fillStyle='hsla(180,60%,15%,0.6)';
    c.beginPath(); c.moveTo(0,-35); c.lineTo(-18,15); c.lineTo(-10,20); c.lineTo(-5,30); c.lineTo(5,30); c.lineTo(10,20); c.lineTo(18,15); c.closePath();
    c.fill(); c.stroke();
    c.fillStyle='hsla(200,90%,60%,0.4)';
    c.beginPath(); c.ellipse(0,-10,5,8,0,0,6.28); c.fill();
    c.strokeStyle='hsl(180,70%,50%)'; c.lineWidth=1.5;
    c.beginPath();c.moveTo(-18,15);c.lineTo(-30,25);c.lineTo(-18,22);c.stroke();
    c.beginPath();c.moveTo(18,15);c.lineTo(30,25);c.lineTo(18,22);c.stroke();
    c.restore(); c.shadowBlur=0;
  }
  // Helpers
  drawRing(x,y,radius,color,lineWidth,alpha) {
    const c = this.ctx; c.globalAlpha = alpha||1;
    c.strokeStyle=color; c.lineWidth=lineWidth||2; c.shadowBlur=10; c.shadowColor=color;
    c.beginPath(); c.arc(x,y,radius,0,6.28); c.stroke();
    c.shadowBlur=0; c.globalAlpha=1;
  }
  drawGlowText(text,x,y,size,color,align) {
    const c = this.ctx; c.font=size+'px "Courier New",monospace';
    c.textAlign=align||'center'; c.textBaseline='middle';
    c.shadowBlur=12; c.shadowColor=color; c.fillStyle=color;
    c.fillText(text,x,y); c.shadowBlur=0;
  }
  drawWaveform(y,amplitude,freq,color,time,alpha) {
    const c = this.ctx; c.globalAlpha = alpha||0.5; c.strokeStyle=color; c.lineWidth=1.5;
    c.beginPath();
    for (let x=0;x<this.w;x+=3) {
      const val = Math.sin(x*freq*0.01+time*3)*amplitude;
      if (x===0) c.moveTo(x,y+val); else c.lineTo(x,y+val);
    }
    c.stroke(); c.globalAlpha=1;
  }
  drawPlanet(x,y,radius,glowColor,intensity) {
    const c = this.ctx;
    c.shadowBlur = 20*intensity; c.shadowColor = glowColor;
    const grad = c.createRadialGradient(x-radius*0.3,y-radius*0.3,radius*0.1,x,y,radius);
    grad.addColorStop(0,'hsl(200,60%,40%)'); grad.addColorStop(0.6,'hsl(160,50%,25%)'); grad.addColorStop(1,'hsl(220,40%,10%)');
    c.fillStyle = grad; c.beginPath(); c.arc(x,y,radius,0,6.28); c.fill();
    // atmosphere
    c.globalAlpha = 0.3*intensity; c.strokeStyle = glowColor; c.lineWidth = 3;
    c.beginPath(); c.arc(x,y,radius+6,0,6.28); c.stroke();
    c.globalAlpha=1; c.shadowBlur=0;
  }
}

// ============================================================
// NOTE DETECTOR
// ============================================================
class NoteDetector {
  warmth(played, target) { return 1.0 - Math.min(Math.abs(played-target),12)/12; }
  isMatch(played, target, tolerance) { return Math.abs(played-target) <= (tolerance||0); }
  proximityLabel(played, target) {
    const w = this.warmth(played, target);
    if (w >= 1.0) return 'TRAVADO';
    if (w >= 0.85) return 'QUENTE';
    if (w >= 0.5) return 'MORNO';
    return 'FRIO';
  }
  proximityColor(played, target) {
    const w = this.warmth(played, target);
    if (w >= 1.0) return '#00ff44';
    if (w >= 0.85) return '#ffcc00';
    if (w >= 0.5) return '#ff8800';
    return '#4488cc';
  }
}

// ============================================================
// SCORE TRACKER
// ============================================================
class ScoreTracker {
  constructor() { this.phases = []; this.startTime = 0; }
  start() { this.startTime = performance.now(); this.phases = []; }
  addPhase(name, stars) { this.phases.push({ name, stars }); }
  totalStars() { return this.phases.reduce((s,p)=>s+p.stars,0); }
  maxStars() { return this.phases.length * 3; }
}

// ============================================================
// TUTORIAL OVERLAY
// ============================================================
class TutorialOverlay {
  constructor() {
    this.titleEl = document.getElementById('phase-title');
    this.subtitleEl = document.getElementById('phase-subtitle');
    this.narrativeEl = document.getElementById('narrative-text');
    this.revealTextEl = document.getElementById('reveal-text');
    this.revealLineEl = document.getElementById('reveal-line');
    this.objectiveEl = document.getElementById('objective-hud');
    this.proximityEl = document.getElementById('proximity-label');
    this.typewriterText = ''; this.typewriterIndex = 0; this.typewriterCallback = null;
    this.typing = false;
  }
  showTitle(text, subtitle) {
    this.titleEl.textContent = text; this.titleEl.classList.add('visible');
    if (subtitle) { this.subtitleEl.textContent = subtitle; this.subtitleEl.classList.add('visible'); }
  }
  hideTitle() { this.titleEl.classList.remove('visible'); this.subtitleEl.classList.remove('visible'); }
  typeNarrative(lines, callback) {
    this.narrativeEl.textContent = '';
    this.revealTextEl.classList.remove('visible');
    this.revealLineEl.classList.remove('visible');
    this.typewriterText = Array.isArray(lines) ? lines.join('\n') : lines;
    this.typewriterIndex = 0; this.typing = true; this.typewriterCallback = callback;
  }
  updateTypewriter() {
    if (!this.typing) return;
    if (this.typewriterIndex < this.typewriterText.length) {
      this.typewriterIndex += 1;
      this.narrativeEl.textContent = this.typewriterText.substring(0, this.typewriterIndex);
    } else {
      this.typing = false;
      if (this.typewriterCallback) this.typewriterCallback();
    }
  }
  clearNarrative() { this.narrativeEl.textContent = ''; this.typing = false; }
  showReveal(lines) {
    this.revealLineEl.classList.add('visible');
    setTimeout(() => {
      this.revealTextEl.textContent = Array.isArray(lines) ? lines.join('\n') : lines;
      this.revealTextEl.classList.add('visible');
    }, 400);
  }
  hideReveal() { this.revealTextEl.classList.remove('visible'); this.revealLineEl.classList.remove('visible'); }
  setObjective(text) { this.objectiveEl.textContent = text; }
  clearObjective() { this.objectiveEl.textContent = ''; }
  showProximity(label, color) {
    this.proximityEl.textContent = label; this.proximityEl.style.color = color;
    this.proximityEl.classList.add('visible');
  }
  hideProximity() { this.proximityEl.classList.remove('visible'); }
  // Control hint diagram
  showControlHint(group, label) {
    // group: 'keys', 'knobs', 'faders', 'pads'
    const container = document.getElementById('control-hint');
    container.classList.add('visible');
    const groups = ['keys','knobs','faders','pads'];
    for (const g of groups) {
      const el = document.getElementById('hint-' + g);
      if (g === group) { el.setAttribute('opacity','1'); el.classList.add('hint-active'); }
      else { el.setAttribute('opacity','0.15'); el.classList.remove('hint-active'); }
    }
    const arrow = document.getElementById('hint-arrow-text');
    if (label) { arrow.textContent = '^ ' + label + ' ^'; arrow.setAttribute('opacity','1'); }
    else { arrow.setAttribute('opacity','0'); }
  }
  hideControlHint() {
    document.getElementById('control-hint').classList.remove('visible');
    const groups = ['keys','knobs','faders','pads'];
    for (const g of groups) document.getElementById('hint-' + g).classList.remove('hint-active');
  }
  clearAll() {
    this.hideTitle(); this.clearNarrative(); this.hideReveal(); this.clearObjective(); this.hideProximity(); this.hideControlHint();
  }
}

// ============================================================
// GAME ENGINE
// ============================================================
const PHASES = [
  { name: 'DESPERTAR', subtitle: 'INICIALIZACAO DO ARRAY DE FREQUENCIAS' },
  { name: 'CALIBRACAO DE POTENCIA', subtitle: 'DINAMICA DE PROPULSAO' },
  { name: 'SINTONIA DO ESCUDO', subtitle: 'ALINHAMENTO HARMONICO' },
  { name: 'NAVEGAR O WORMHOLE', subtitle: 'NAVEGACAO POR FREQUENCIA' },
  { name: 'PRIMEIRO CONTATO', subtitle: 'COMUNICACAO POR PADROES' },
];

class GameEngine {
  constructor(audio, visual, overlay, score, detector) {
    this.audio = audio; this.visual = visual; this.overlay = overlay;
    this.score = score; this.detector = detector;
    this.phase = -1; this.state = 'IDLE'; // INTRO, ACTIVE, REVEAL, TRANSITION
    this.phaseTime = 0; this.stateTime = 0;
    this.phaseData = {};
    this.typewriterTimer = 0;
  }

  start(fromPhase) {
    this.score.start();
    // Restore checkpoint
    const saved = fromPhase !== undefined ? fromPhase : this.loadCheckpoint();
    this.phase = saved > 0 ? saved - 1 : -1; // -1 because advancePhase increments
    if (this.phase >= 0) {
      // Skip ahead visuals
      this.visual.setStarCount(300); this.visual.shipVisible = true;
      this.visual.shipX = this.visual.cx; this.visual.shipY = this.visual.cy;
      this.visual.bgAlpha = 0.18; this.visual.bgColor = [10,10,26];
    } else {
      this.visual.setStarCount(0); this.visual.shipVisible = false;
      this.visual.bgAlpha = 0.95; this.visual.bgColor = [2,2,6];
    }
    this.advancePhase();
  }

  saveCheckpoint() {
    localStorage.setItem('synth_academy_checkpoint', JSON.stringify({ phase: this.phase, scores: this.score.phases }));
  }

  loadCheckpoint() {
    try {
      const saved = JSON.parse(localStorage.getItem('synth_academy_checkpoint'));
      if (saved && saved.phase >= 0) {
        // Restore scores for completed phases
        if (saved.scores) this.score.phases = saved.scores;
        return saved.phase;
      }
    } catch(e) { /* ignore */ }
    return 0;
  }

  advancePhase() {
    this.phase++;
    if (this.phase >= 5) { this.complete(); return; }
    this.saveCheckpoint();
    this.state = 'INTRO'; this.stateTime = 0; this.phaseTime = 0;
    this.phaseData = {};
    this.overlay.clearAll();
    this.overlay.showTitle('PHASE ' + (this.phase+1), PHASES[this.phase].name);
    setTimeout(() => {
      this.overlay.hideTitle();
      this.setupPhase();
    }, 2500);
  }

  setupPhase() {
    this.state = 'ACTIVE'; this.stateTime = 0;
    const p = this.phase;

    if (p === 0) { // WAKE UP
      this.phaseData = { uniqueNotes: new Set(), bands: [], target: 5 };
      this.overlay.typeNarrative([
        'SISTEMAS DA NAVE OFFLINE',
        'REATOR PRINCIPAL: INATIVO',
        'TOQUE AS TECLAS PARA INICIAR A SEQUENCIA DE BOOT...'
      ]);
      this.overlay.showControlHint('keys', 'TOQUE AS TECLAS BRANCAS');
    }
    else if (p === 1) { // POWER CALIBRATION
      this.phaseData = { round: 0, rounds: [{min:20,max:50,label:'SUAVE'},{min:51,max:90,label:'MEDIO'},{min:91,max:127,label:'FORTE'}], attempts:0, totalAttempts:0, matched:false, matchTime:0, playerVel:0, showPlayer:false };
      this.visual.shipVisible = true; this.visual.shipX = this.visual.cx; this.visual.shipY = this.visual.cy;
      this.overlay.typeNarrative([
        'POTENCIA DO MOTOR INSTAVEL',
        'CALIBRE A PROPULSAO IGUALANDO A INTENSIDADE DO ALVO',
        'TOQUE LEVE... DEPOIS FORCA TOTAL.'
      ]);
      this.overlay.showControlHint('keys', 'TOQUE AS TECLAS COM FORCA DIFERENTE');
    }
    else if (p === 2) { // SHIELD TUNING
      this.phaseData = { filterValue: 0.5, targetMin: 0.55, targetMax: 0.70, inZoneTime: 0, locked: false, ccDetected: false, detectedCC: -1, hintTimer: 0, startTime: performance.now() };
      this.audio.setFilterDirect(0.5);
      this.audio.playDrone(60, 80);
      this.overlay.typeNarrative([
        'ALERTA: CAMPO DE RADIACAO DETECTADO',
        'ESCUDOS PRECISAM DE ALINHAMENTO DE FREQUENCIA',
        'GIRE UM KNOB PARA ALINHAR A HARMONICA DO ESCUDO'
      ]);
      this.overlay.showControlHint('knobs', 'GIRE QUALQUER KNOB (BOTOES REDONDOS)');
    }
    else if (p === 3) { // WORMHOLE
      const noteNames = {60:'DO (C)',64:'MI (E)',67:'SOL (G)',72:'DO agudo (C)'};
      const notePositions = {60:'NO MEIO DO TECLADO',64:'UM POUCO A DIREITA DO MEIO',67:'MAIS A DIREITA',72:'BEM NA PONTA DIREITA'};
      this.phaseData = {
        gates: [
          { note:60, x:0.25, y:0.6, locked:false },
          { note:64, x:0.42, y:0.47, locked:false },
          { note:67, x:0.58, y:0.37, locked:false },
          { note:72, x:0.75, y:0.2, locked:false },
        ],
        activeGate: 0, attempts: 0, lastWarmth: 0, hintTimer: 0,
        lastPlayedNote: -1, hintLevel: 0, noteNames, notePositions,
        gateTimers: [0,0,0,0]
      };
      this.overlay.typeNarrative([
        'WORMHOLE DETECTADO — COORDENADAS TRAVADAS',
        'NAVEGUE PELOS PORTAIS HARMONICOS',
        'CADA PORTAL RESSOA EM UMA FREQUENCIA ESPECIFICA',
        'ENCONTRE O TOM CERTO PARA ATRAVESSAR'
      ]);
      this.overlay.showControlHint('keys', 'EXPERIMENTE DIFERENTES TECLAS');
    }
    else if (p === 4) { // FIRST CONTACT
      this.phaseData = {
        rounds: [[60,64],[60,64,67],[60,64,67,72]],
        currentRound: 0, state: 'LISTEN', playerNotes: [], retries: 0, respondTimer: 0,
        planetPlaying: false, listenDone: false,
        noteColors: {60:'#00ffcc',64:'#44ff88',67:'#ffcc44',72:'#ff44cc'},
        noteNames: {60:'DO',64:'MI',67:'SOL',72:'DO agudo'},
        planetPulse: 0, planetPulseColor: '#00ffcc', commWaves: []
      };
      this.visual.shipY = this.visual.h * 0.75;
      this.overlay.typeNarrative([
        'SINAL DETECTADO NA SUPERFICIE DO PLANETA',
        'UM PADRAO INTELIGENTE — TENTANDO COMUNICACAO',
        'OUCA... DEPOIS REPITA NAS TECLAS.'
      ], () => { setTimeout(() => this.playPlanetSequence(), 1500); });
      this.overlay.showControlHint('keys', 'OUCA E REPITA NAS TECLAS');
    }
  }

  playPlanetSequence() {
    const pd = this.phaseData;
    const seq = pd.rounds[pd.currentRound];
    pd.planetPlaying = true; pd.state = 'LISTEN';
    this.overlay.setObjective('OUCA...');
    let i = 0;
    const gap = 600 - pd.currentRound * 50;
    const playNext = () => {
      if (i >= seq.length) {
        pd.planetPlaying = false; pd.listenDone = true; pd.state = 'RESPOND';
        pd.playerNotes = []; pd.respondTimer = 0;
        this.overlay.setObjective('SUA VEZ — REPITA O PADRAO');
        return;
      }
      const note = seq[i];
      pd.planetPulse = 1; pd.planetPulseColor = pd.noteColors[note] || '#00ffcc';
      this.audio.playNote(note, 90, gap*0.7/1000);
      i++;
      setTimeout(playNext, gap);
    };
    playNext();
  }

  onNoteOn(note, velocity, channel) {
    // During REVEAL: any key advances to next phase
    if (this.state === 'REVEAL' && this.phaseData.waitingForKey) {
      this.phaseData.waitingForKey = false;
      this.overlay.hideReveal();
      this.overlay.clearAll();
      this.advancePhase();
      return;
    }
    if (this.state !== 'ACTIVE') return;
    const p = this.phase;

    // Always play the note audibly
    this.audio.noteOn(note, velocity);
    // Show what note was played (learning aid)
    const noteLetters = ['DO','DO#','RE','RE#','MI','FA','FA#','SOL','SOL#','LA','LA#','SI'];
    const noteName = noteLetters[note % 12] + Math.floor(note / 12 - 1);
    this.lastNoteDisplay = 'NOTA: ' + noteName + ' (MIDI ' + note + ')';

    if (p === 0) {
      const pd = this.phaseData;
      if (channel !== 10 && !pd.uniqueNotes.has(note)) {
        pd.uniqueNotes.add(note);
        // Y position: MIDI 48-72 -> 85%-15%
        const normY = 1 - Math.max(0, Math.min(1, (note - 48) / 24));
        const y = this.visual.h * (0.15 + normY * 0.7);
        pd.bands.push({ y, alpha: 1, note });
        this.visual.setStarCount(pd.uniqueNotes.size * 60);
        this.visual.emitBurst(this.visual.cx, y, 20, 3, 180, 0.8);
        this.overlay.setObjective('SISTEMAS: ' + pd.uniqueNotes.size + '/' + pd.target + ' ONLINE');
        if (pd.uniqueNotes.size >= pd.target) {
          setTimeout(() => this.phaseReveal(), 800);
        }
      }
    }
    else if (p === 1) {
      if (channel === 10) return;
      const pd = this.phaseData;
      if (pd.matched) return;
      pd.playerVel = velocity; pd.showPlayer = true; pd.attempts++;
      const round = pd.rounds[pd.round];
      if (velocity >= round.min && velocity <= round.max) {
        pd.matched = true; pd.matchTime = 0; pd.totalAttempts += pd.attempts;
        this.visual.emitBurst(this.visual.shipX, this.visual.shipY, 30, 4, 120, 0.8);
      }
    }
    else if (p === 3) {
      if (channel === 10) return;
      const pd = this.phaseData;
      if (pd.activeGate >= 4) return;
      const gate = pd.gates[pd.activeGate];
      pd.attempts++; pd.lastPlayedNote = note; pd.gateTimers[pd.activeGate] = 0; // reset hint timer on play
      const w = this.detector.warmth(note, gate.note);
      pd.lastWarmth = w;
      // Proximity + direction hint
      const diff = gate.note - note;
      let lbl = this.detector.proximityLabel(note, gate.note);
      const clr = this.detector.proximityColor(note, gate.note);
      if (lbl !== 'TRAVADO') {
        if (Math.abs(diff) <= 2) lbl += ' — QUASE!';
        else if (diff > 0) lbl += ' ➜ MAIS PRA DIREITA';
        else lbl += ' ⬅ MAIS PRA ESQUERDA';
      }
      this.overlay.showProximity(lbl, clr);
      if (this.detector.isMatch(note, gate.note, 1)) { // tolerance ±1 semitone
        gate.locked = true;
        pd.hintLevel = 0;
        this.visual.emitBurst(gate.x*this.visual.w, gate.y*this.visual.h, 40, 5, 120, 1);
        pd.activeGate++;
        this.overlay.hideProximity();
        if (pd.activeGate >= 4) {
          setTimeout(() => this.phaseReveal(), 1000);
        } else {
          pd.hintTimer = 0;
        }
      }
    }
    else if (p === 4) {
      if (channel === 10) return;
      const pd = this.phaseData;
      if (pd.state !== 'RESPOND') return;
      const seq = pd.rounds[pd.currentRound];
      const idx = pd.playerNotes.length;
      const target = seq[idx];
      if (this.detector.isMatch(note, target, 1)) {
        pd.playerNotes.push(note);
        pd.commWaves.push({ progress:0, color: pd.noteColors[target]||'#00ffcc' });
        this.overlay.setObjective('TRANSMITINDO: ' + pd.playerNotes.length + '/' + seq.length);
        if (pd.playerNotes.length >= seq.length) {
          // Round complete
          pd.currentRound++;
          if (pd.currentRound >= pd.rounds.length) {
            this.overlay.setObjective('COMUNICACAO ESTABELECIDA');
            setTimeout(() => this.phaseReveal(), 1500);
          } else {
            pd.state = 'LISTEN'; pd.playerNotes = [];
            this.overlay.setObjective('SINAL RECONHECIDO');
            setTimeout(() => this.playPlanetSequence(), 2000);
          }
        }
      } else {
        // Wrong note
        pd.retries++;
        pd.playerNotes = [];
        this.overlay.setObjective('SINAL PERDIDO — OUCA DE NOVO');
        this.visual.bgColor = [30,5,5];
        setTimeout(() => { this.visual.bgColor = [5,8,20]; this.playPlanetSequence(); }, 1500);
      }
    }
  }

  onNoteOff(note, channel) {
    if (channel !== 10) this.audio.noteOff(note);
  }

  onRawCC(cc, value) {
    if (this.state !== 'ACTIVE' || this.phase !== 2) return;
    const pd = this.phaseData;
    if (cc === 1) return; // ignore mod wheel
    if (!pd.ccDetected) { pd.ccDetected = true; pd.detectedCC = cc; }
    if (cc !== pd.detectedCC) return;
    pd.filterValue = value / 127;
    this.audio.setFilterDirect(pd.filterValue);
    pd.hintTimer = 0;
  }

  phaseReveal() {
    this.state = 'REVEAL'; this.stateTime = 0;
    this.overlay.clearNarrative();
    this.overlay.clearObjective();
    this.overlay.hideProximity();
    this.overlay.hideControlHint();

    const p = this.phase;
    let stars = 1;
    let revealLines = [];

    if (p === 0) {
      stars = 3;
      this.visual.setStarCount(300); this.visual.shipVisible = true;
      this.visual.shipX = this.visual.cx; this.visual.shipY = this.visual.cy;
      this.visual.bgAlpha = 0.18; this.visual.bgColor = [10,10,26];
      revealLines = [
        'ARRAY DE FREQUENCIAS: ONLINE',
        'Cada tecla produz uma nota diferente.',
        'Teclas mais altas = frequencia mais aguda.',
        'SEQUENCIA DE BOOT COMPLETA.'
      ];
    }
    else if (p === 1) {
      const att = this.phaseData.totalAttempts;
      stars = att <= 6 ? 3 : att <= 12 ? 2 : 1;
      revealLines = [
        'PROPULSAO CALIBRADA',
        'Isso foi VELOCITY — a forca com que voce aperta a tecla.',
        'Toque suave = som baixo. Toque forte = som intenso.',
        'Seu toque molda a energia de cada nota.'
      ];
    }
    else if (p === 2) {
      this.audio.stopDrone();
      const elapsed = (performance.now() - this.phaseData.startTime) / 1000;
      stars = elapsed < 15 ? 3 : elapsed < 30 ? 2 : 1;
      revealLines = [
        'ESCUDOS ALINHADOS',
        'Voce controlou um FILTRO LOW-PASS.',
        'Ele muda o brilho do som.',
        'Girar pra baixo = escuro, abafado. Pra cima = brilhante, agudo.',
        'Todo som de synth e moldado por filtros.'
      ];
    }
    else if (p === 3) {
      const att = this.phaseData.attempts;
      stars = att <= 5 ? 3 : att <= 10 ? 2 : 1;
      revealLines = [
        'WORMHOLE ATRAVESSADO',
        'Voce tocou: DO  MI  SOL  DO',
        'Isso e um arpejo de DO Maior — um dos padroes',
        'mais fundamentais de toda a musica.'
      ];
    }
    else if (p === 4) {
      const ret = this.phaseData.retries;
      stars = ret === 0 ? 3 : ret <= 3 ? 2 : 1;
      revealLines = [
        'COMUNICACAO ESTABELECIDA',
        '',
        'RELATORIO DA MISSAO:',
        'TECLAS controlam PITCH — a altura do som',
        'VELOCITY controla DINAMICA — a intensidade do toque',
        'FILTROS moldam TIMBRE — a cor do som',
        'SEQUENCIAS criam MELODIA — padroes com significado',
        '',
        'A linguagem da sintese agora e sua para explorar.'
      ];
    }

    this.score.addPhase(PHASES[p].name, stars);
    this.overlay.showReveal(revealLines);
    // Show "press any key to continue" after a short delay
    setTimeout(() => {
      this.overlay.setObjective('TOQUE QUALQUER TECLA PARA CONTINUAR...');
      this.phaseData.waitingForKey = true;
    }, 2000);
  }

  complete() {
    this.state = 'COMPLETE';
    localStorage.removeItem('synth_academy_checkpoint');
    const mc = document.getElementById('mission-complete');
    const rows = document.getElementById('score-rows');
    const total = document.getElementById('score-total');
    rows.textContent = '';
    for (const p of this.score.phases) {
      const row = document.createElement('div');
      row.className = 'score-row';
      const name = document.createElement('span');
      name.textContent = p.name;
      name.style.width = '220px';
      const stars = document.createElement('span');
      stars.className = 'score-stars';
      stars.textContent = '\u2605'.repeat(p.stars) + '\u2606'.repeat(3-p.stars);
      row.appendChild(name);
      row.appendChild(stars);
      rows.appendChild(row);
    }
    total.textContent = 'TOTAL: ' + this.score.totalStars() + '/' + this.score.maxStars() + ' ESTRELAS';
    mc.classList.add('active');
  }

  update(dt, time) {
    this.phaseTime += dt; this.stateTime += dt;

    // Typewriter
    this.typewriterTimer += dt;
    if (this.typewriterTimer > 0.03) { this.typewriterTimer = 0; this.overlay.updateTypewriter(); }

    this.visual.updateParticles(dt);

    if (this.state !== 'ACTIVE') return;
    const p = this.phase;

    if (p === 0) {
      // Fade bands
      const pd = this.phaseData;
      for (let i = 0; i < pd.bands.length; i++) pd.bands[i].alpha = Math.max(0.2, pd.bands[i].alpha - dt * 0.3);
    }
    else if (p === 1) {
      const pd = this.phaseData;
      if (pd.matched) {
        pd.matchTime += dt;
        if (pd.matchTime > 1.2) {
          pd.round++;
          if (pd.round >= 3) { this.phaseReveal(); return; }
          pd.matched = false; pd.attempts = 0; pd.showPlayer = false;
          this.overlay.setObjective(pd.rounds[pd.round].label + ' — IGUALE O ANEL');
        }
      }
      if (!pd.showPlayer && pd.round < 3) {
        this.overlay.setObjective(pd.rounds[pd.round].label + ' — TOQUE QUALQUER TECLA');
      }
    }
    else if (p === 2) {
      const pd = this.phaseData;
      if (pd.locked) return;
      pd.hintTimer += dt;
      if (pd.hintTimer > 8 && !pd.ccDetected) {
        this.overlay.setObjective('TENTE GIRAR UM KNOB NO SEU CONTROLADOR...');
      } else if (pd.ccDetected) {
        if (pd.filterValue >= pd.targetMin && pd.filterValue <= pd.targetMax) {
          pd.inZoneTime += dt;
          this.overlay.setObjective('SEGURE FIRME... ' + Math.round(Math.min(pd.inZoneTime/1.5,1)*100) + '%');
          if (pd.inZoneTime >= 1.5) {
            pd.locked = true;
            this.visual.emitBurst(this.visual.shipX, this.visual.shipY, 50, 5, 120, 1);
            setTimeout(() => this.phaseReveal(), 800);
          }
        } else {
          pd.inZoneTime = 0;
          this.overlay.setObjective('SINTONIZANDO ESCUDOS...');
        }
      }
    }
    else if (p === 3) {
      const pd = this.phaseData;
      if (pd.activeGate < 4) {
        const gi = pd.activeGate;
        pd.gateTimers[gi] += dt;
        pd.hintTimer += dt;
        // Audio hint every 5s
        if (pd.hintTimer > 5) {
          pd.hintTimer = 0;
          const gate = pd.gates[gi];
          this.audio.playNote(gate.note, 35, 0.6);
        }
        // Progressive text hints
        const gt = pd.gateTimers[gi];
        const gate = pd.gates[gi];
        let obj = 'PORTAL ' + (gi+1) + '/4';
        if (gt > 20) {
          // Level 3: show exact note
          obj += '  |  NOTA: ' + pd.noteNames[gate.note];
          this.overlay.showControlHint('keys', 'A NOTA E ' + pd.noteNames[gate.note] + ' — ' + pd.notePositions[gate.note]);
        } else if (gt > 12) {
          // Level 2: show region
          obj += '  |  ' + pd.notePositions[gate.note];
        } else if (gt > 5) {
          // Level 1: show direction
          if (pd.lastPlayedNote > 0) {
            const diff = gate.note - pd.lastPlayedNote;
            if (Math.abs(diff) <= 2) obj += '  |  QUASE! TENTE TECLAS VIZINHAS';
            else if (diff > 0) obj += '  |  ➜ TENTE MAIS PRA DIREITA';
            else obj += '  |  ⬅ TENTE MAIS PRA ESQUERDA';
          } else {
            obj += '  |  TOQUE UMA TECLA QUALQUER PRA COMECAR';
          }
        }
        this.overlay.setObjective(obj);
      }
    }
    else if (p === 4) {
      const pd = this.phaseData;
      if (pd.planetPulse > 0) pd.planetPulse = Math.max(0, pd.planetPulse - dt * 3);
      // Comm waves animation
      for (let i = pd.commWaves.length-1; i >= 0; i--) {
        pd.commWaves[i].progress += dt * 1.5;
        if (pd.commWaves[i].progress > 1) pd.commWaves.splice(i, 1);
      }
      // Progressive hints during RESPOND
      if (pd.state === 'RESPOND') {
        pd.respondTimer += dt;
        const seq = pd.rounds[pd.currentRound];
        const nextIdx = pd.playerNotes.length;
        if (nextIdx < seq.length) {
          let obj = 'SUA VEZ — REPITA O PADRAO';
          if (pd.respondTimer > 10) {
            // Show all note names
            const names = seq.map(n => pd.noteNames[n] || n);
            obj = 'NOTAS: ' + names.join(' → ');
          } else if (pd.respondTimer > 5) {
            // Show next note name
            obj = 'PROXIMA NOTA: ' + (pd.noteNames[seq[nextIdx]] || seq[nextIdx]);
          }
          this.overlay.setObjective(obj);
        }
      }
    }
  }

  render(time) {
    const c = this.visual.ctx;
    this.visual.renderBg(time);
    this.visual.renderStars(time);
    this.visual.renderParticles(time, 8);
    this.visual.renderShip(time);

    // Show last note played (bottom-left)
    if (this.lastNoteDisplay) {
      this.visual.drawGlowText(this.lastNoteDisplay, 20, this.visual.h - 20, 10, 'rgba(0,255,204,0.4)', 'left');
    }

    const p = this.phase;
    if (this.state === 'INTRO' || this.state === 'REVEAL' || this.state === 'TRANSITION') return;
    if (this.state !== 'ACTIVE') return;

    if (p === 0) {
      const pd = this.phaseData;
      for (let i = 0; i < pd.bands.length; i++) {
        const b = pd.bands[i];
        c.globalAlpha = b.alpha * 0.4;
        c.fillStyle = '#00ffcc';
        c.shadowBlur = 15; c.shadowColor = '#00ffcc';
        c.fillRect(0, b.y - 1, this.visual.w, 2);
        c.shadowBlur = 0;
      }
      c.globalAlpha = 1;
    }
    else if (p === 1) {
      const pd = this.phaseData;
      if (pd.round < 3) {
        const round = pd.rounds[pd.round];
        const targetR = ((round.min + round.max) / 2 / 127) * 160;
        const color = pd.matched ? '#00ff44' : '#00ffcc';
        // Target ring
        c.setLineDash([8,8]);
        this.visual.drawRing(this.visual.shipX, this.visual.shipY, targetR, color, 2, 0.5 + Math.sin(time*3)*0.2);
        c.setLineDash([]);
        // Label
        this.visual.drawGlowText(round.label, this.visual.shipX, this.visual.shipY - targetR - 20, 14, color);
        // Player ring
        if (pd.showPlayer) {
          const playerR = (pd.playerVel / 127) * 160;
          const inRange = pd.playerVel >= round.min && pd.playerVel <= round.max;
          const pColor = inRange ? '#00ff44' : (Math.abs(pd.playerVel - (round.min+round.max)/2) < 30 ? '#ff8800' : '#ff3344');
          this.visual.drawRing(this.visual.shipX, this.visual.shipY, playerR, pColor, 3, 0.8);
        }
      }
    }
    else if (p === 2) {
      const pd = this.phaseData;
      // Radiation waves
      for (let i = 0; i < 5; i++) {
        const y = this.visual.h * (0.2 + i * 0.15);
        const blocked = pd.filterValue >= pd.targetMin && pd.filterValue <= pd.targetMax;
        const col = blocked ? 'rgba(0,255,100,0.3)' : 'hsl(320,80%,50%)';
        this.visual.drawWaveform(y, 20 + i * 5, 0.5 + i * 0.2, col, time, blocked ? 0.2 : 0.4);
      }
      // Shield arc
      if (pd.ccDetected) {
        const inZone = pd.filterValue >= pd.targetMin && pd.filterValue <= pd.targetMax;
        const shieldColor = inZone ? '#00ff88' : '#4488aa';
        const shieldAlpha = inZone ? 0.6 : 0.3;
        c.globalAlpha = shieldAlpha; c.strokeStyle = shieldColor;
        c.shadowBlur = inZone ? 20 : 5; c.shadowColor = shieldColor;
        c.lineWidth = 3; c.beginPath();
        c.arc(this.visual.shipX, this.visual.shipY, 60, -Math.PI*0.6, Math.PI*0.6);
        c.stroke(); c.shadowBlur = 0; c.globalAlpha = 1;
        // Filter meter
        const mX = 40; const mH = this.visual.h * 0.5; const mY = this.visual.h * 0.25;
        c.fillStyle = 'rgba(255,255,255,0.05)'; c.fillRect(mX, mY, 8, mH);
        // Target zone
        const tY1 = mY + mH * (1 - pd.targetMax); const tY2 = mY + mH * (1 - pd.targetMin);
        c.fillStyle = 'rgba(0,255,100,0.15)'; c.fillRect(mX, tY1, 8, tY2 - tY1);
        // Current value
        const curY = mY + mH * (1 - pd.filterValue);
        c.fillStyle = inZone ? '#00ff88' : '#ff8800';
        c.fillRect(mX - 2, curY - 2, 12, 4);
      }
    }
    else if (p === 3) {
      const pd = this.phaseData;
      // Wormhole bg
      c.globalAlpha = 0.15;
      for (let i = 0; i < 8; i++) {
        const r = 30 + i * 30 + Math.sin(time * 0.5 + i) * 10;
        c.strokeStyle = 'hsl(' + (200 + i * 15) + ',60%,40%)';
        c.lineWidth = 1; c.beginPath();
        c.ellipse(this.visual.cx, this.visual.cy, r * 1.5, r, time * 0.2, 0, 6.28);
        c.stroke();
      }
      c.globalAlpha = 1;
      // Gates
      for (let i = 0; i < 4; i++) {
        const g = pd.gates[i];
        const gx = g.x * this.visual.w; const gy = g.y * this.visual.h;
        const isActive = i === pd.activeGate;
        if (g.locked) {
          this.visual.drawRing(gx, gy, 25, '#00ff44', 3, 0.8);
          this.visual.drawGlowText('\u2713', gx, gy, 20, '#00ff44');
        } else if (isActive) {
          const pulseR = 25 + Math.sin(time * 4) * 5;
          const warmthColor = pd.lastWarmth > 0.5 ? 'hsl(' + (120 * pd.lastWarmth) + ',100%,60%)' : '#4488cc';
          this.visual.drawRing(gx, gy, pulseR, warmthColor, 2, 0.6 + Math.sin(time*3)*0.3);
          this.visual.drawGlowText('PORTAL ' + (i+1), gx, gy + 40, 10, warmthColor);
        } else {
          this.visual.drawRing(gx, gy, 20, '#223344', 1, 0.2);
        }
      }
    }
    else if (p === 4) {
      const pd = this.phaseData;
      const planetX = this.visual.cx; const planetY = this.visual.h * 0.22;
      const glow = 0.3 + pd.planetPulse * 0.7;
      this.visual.drawPlanet(planetX, planetY, 60, pd.planetPulseColor, glow);
      // Comm waves
      for (let i = 0; i < pd.commWaves.length; i++) {
        const cw = pd.commWaves[i];
        const fromY = this.visual.shipY; const toY = planetY + 60;
        const curY = fromY + (toY - fromY) * cw.progress;
        c.globalAlpha = 1 - cw.progress;
        c.strokeStyle = cw.color; c.lineWidth = 2; c.shadowBlur = 10; c.shadowColor = cw.color;
        c.beginPath(); c.moveTo(this.visual.cx - 20, curY); c.lineTo(this.visual.cx + 20, curY); c.stroke();
        c.shadowBlur = 0; c.globalAlpha = 1;
      }
      // Turn indicator
      if (pd.state === 'RESPOND') {
        this.visual.drawGlowText('SUA VEZ', this.visual.cx, this.visual.h * 0.5, 16, '#00ffcc');
      }
    }
  }
}

// ============================================================
// MAIN
// ============================================================
const canvasEl = document.getElementById('canvas');
const midi = new MIDIController();
const audio = new AudioEngine();
const visual = new VisualEngine(canvasEl);
const overlay = new TutorialOverlay();
const score = new ScoreTracker();
const detector = new NoteDetector();
const game = new GameEngine(audio, visual, overlay, score, detector);

let lastTime = 0;
let gameStarted = false;
let missionComplete = false;

function gameLoop(timestamp) {
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;
  const time = timestamp / 1000;
  game.update(dt, time);
  game.render(time);
  requestAnimationFrame(gameLoop);
}

// MIDI wiring
midi.on('connectionChange', (c) => {
  document.getElementById('hud-dot').className = c ? 'hud-dot online' : 'hud-dot';
  document.getElementById('hud-status-text').textContent = c ? 'MINILAB 3 CONECTADO' : 'SEM DISPOSITIVO';
});

midi.on('noteOn', ({ channel, note, velocity }) => {
  if (missionComplete) {
    missionComplete = false;
    document.getElementById('mission-complete').classList.remove('active');
    game.phase = -1; game.state = 'IDLE';
    game.start();
    return;
  }
  game.onNoteOn(note, velocity, channel);
});

midi.on('noteOff', ({ channel, note }) => {
  game.onNoteOff(note, channel);
});

midi.on('rawCC', ({ cc, value }) => {
  game.onRawCC(cc, value);
});

// Watch for mission complete
const origComplete = game.complete.bind(game);
game.complete = function() {
  origComplete();
  missionComplete = true;
};

// Show checkpoint info on start screen
(function showCheckpoint() {
  try {
    const saved = JSON.parse(localStorage.getItem('synth_academy_checkpoint'));
    if (saved && saved.phase > 0) {
      const phaseName = PHASES[saved.phase] ? PHASES[saved.phase].name : 'FASE ' + (saved.phase + 1);
      document.getElementById('checkpoint-info').textContent = 'CHECKPOINT: ' + phaseName;
      document.getElementById('reset-progress').style.display = 'block';
    }
  } catch(e) { /* ignore */ }
})();

document.getElementById('reset-progress').addEventListener('click', (e) => {
  e.stopPropagation();
  localStorage.removeItem('synth_academy_checkpoint');
  document.getElementById('checkpoint-info').textContent = '';
  document.getElementById('reset-progress').style.display = 'none';
});

// Start
document.getElementById('start-screen').addEventListener('click', () => {
  document.getElementById('start-screen').style.display = 'none';
  audio.init();
  midi.init();
  lastTime = performance.now();
  requestAnimationFrame(gameLoop);
  setTimeout(() => game.start(), 500);
});
</script>
